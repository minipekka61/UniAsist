{% extends "temel.html" %}
{% block baslik %}Şifre Değiştir — UniAsist{% endblock %}
{% block icerik %}
<div class="kart">
    <h1>Şifre Değiştir</h1>
    <form method="post">
        <label>Mevcut Şifre
            <input type="password" name="mevcut_sifre" required>
        </label>
        <label>Yeni Şifre
            <input type="password" name="yeni_sifre" required minlength="8">
        </label>
        <label>Yeni Şifre (Tekrar)
            <input type="password" name="yeni_sifre_tekrar" required minlength="8">
        </label>
        <button type="submit">Kaydet</button>
    </form>
</div>
{% endblock %}
